# EXAMPLE *project* compose file — copy this into YOUR project's root as
# `compose.yaml`. It is NOT part of the claude-dotnet-devcontainer image and is
# not used by claude-box-dotnet; it defines how your application runs.
#
#   docker compose up            # start the app + a local Postgres
#   docker compose up -d         # ... in the background
#   docker compose down          # stop everything
#
# How it fits with the Claude dev container:
#   * The `api` service bind-mounts the SAME project directory that the Claude
#     dev container edits (`.` -> /app), so changes appear live and `dotnet watch`
#     restarts the app automatically.
#   * `db` publishes 5432 to the host, so the Claude dev container reaches it at
#     host.docker.internal:5432 (the default ConnectionStrings__Default), while
#     `api` reaches it in-network at db:5432. The two stacks stay decoupled.
#
# Assumes a .NET 10 ASP.NET Core project; adjust the project path below.

name: myapp   # change to your project's name

services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0   # Microsoft official SDK image
    working_dir: /app
    # CHANGE ME: path to your web project's .csproj. For faster startup in a real
    # project, bake restore into a small Dockerfile instead of restoring on boot.
    command: dotnet watch run --no-launch-profile --project src/Api/Api.csproj
    volumes:
      - .:/app                       # live bind-mount of your source (same dir Claude edits)
      - nuget:/root/.nuget/packages  # NuGet cache kept out of the repo
      - artifacts:/artifacts         # bin/ and obj/ kept OUT of the mount (see ArtifactsPath)
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"   # reliable file watching on bind mounts
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Same mechanism as the dev container image: MSBuild reads this env var, so
      # no bin/ or obj/ leaks into the repo from the compose stack either.
      ArtifactsPath: /artifacts
      ConnectionStrings__Default: Host=db;Port=5432;Database=app;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"                  # published so the Claude dev container can reach it via host.docker.internal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  nuget:       # the app's NuGet package cache (outside the bind mount)
  artifacts:   # build output (outside the bind mount)
  pgdata:      # Postgres data, persists across `docker compose down`
